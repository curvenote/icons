name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Version Packages PR / push tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:packages
      - run: bun run test
      # Even though we use bun for install and test runners we still publish using npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm trusted publishing needs npm >= 11.5.1 (Node 22 ships an older npm).
      # OIDC exchange replaces a long-lived token, and provenance is automatic.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Version bump and create pull request OR publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 🚀 Release
          title: 🚀 Release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
